name: 📸 Paparazzi — render UI snapshots

# WHAT THIS DOES
#   Renders the Paparazzi snapshot tests (App/app/src/test/.../PaparazziPreviewTest.kt)
#   on the JVM via Layoutlib — real Compose UI to PNG, no emulator, no device —
#   and uploads the goldens + the HTML report as an artifact.
#
#   First run on a branch records the goldens (`:app:recordPaparazziDebug` writes
#   them to App/app/src/test/snapshots/). Commit those PNGs and later runs verify
#   against them (`:app:verifyPaparazziDebug`, which also runs inside the main
#   ci.yml's testDebugUnitTest). Until the goldens are committed, the main ci.yml
#   run on this branch fails on the Paparazzi tests (verify mode, missing goldens)
#   — that is the expected onboarding state, not a code regression.
#
# WHAT IT NEEDS
#   Nothing secret beyond what ci.yml already uses (GOOGLE_SERVICES_JSON secret
#   for the google-services plugin). JDK 17, Android SDK platforms 35 + 36.

on:
  workflow_dispatch:
  push:
    # Every paparazzi-* branch records its own goldens — the trial branch
    # name was pinned here by accident (2026-11-15: the Detail branch's
    # push never triggered a record run). Main is deliberately excluded:
    # recording on main would silently re-record goldens on every merge.
    branches: ["paparazzi-*"]
    paths:
      - "App/**"
      - ".github/workflows/paparazzi.yml"

permissions:
  contents: read

concurrency:
  group: paparazzi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: recordPaparazziDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ☕ Set up JDK 17 (temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 📦 Restore Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java17-${{ hashFiles('App/gradle/wrapper/gradle-wrapper.properties', 'App/gradle/libs.versions.toml', 'App/**/*.gradle.kts', 'App/**/*.gradle', 'App/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-java17-
            gradle-${{ runner.os }}-

      - name: 📱 Install Android SDK (platform-tools, android-35, android-36, build-tools 35.0.0)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0"

      - name: 🔧 Make gradlew executable
        run: chmod +x App/gradlew

      - name: 🔑 Restore google-services.json (CI secret, never committed)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON secret is empty" >&2; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > App/app/google-services.json

      - name: "📸 Record Paparazzi snapshots"
        working-directory: App
        # --tests: Paparazzi classes ONLY. The record/verify tasks drive
        # testDebugUnitTest, which runs the whole suite in shared forks;
        # if a Robolectric test loads first in a fork, Paparazzi's
        # Bridge.init fails (cashapp/paparazzi#1979) and every Paparazzi
        # test in that fork dies — the APP-10 verify step proved it
        # (06:31Z 24 Nov: "Failed to init Bridge" + "sessionParamsBuilder
        # has not been initialized" + a Robolectric UnsatisfiedLinkError,
        # all in one run). The PaparazziTask forwards --tests to the Test
        # tasks, so only the two Paparazzi-rule classes execute here and
        # no Robolectric class ever loads in their forks. (APP-10, 2026-11-24.)
        run: |
          ./gradlew :app:recordPaparazziDebug \
            --tests "com.raddstream.app.ui.PaparazziPreviewTest" \
            --tests "com.raddstream.app.ui.PlayerLandscapePaparazziTest" \
            --tests "com.raddstream.app.ui.SearchLargeFontPaparazziTest" \
            --no-daemon --stacktrace --console=plain

      - name: 📤 Upload snapshots + report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: paparazzi-snapshots-${{ github.run_number }}
          path: |
            App/app/src/test/snapshots
            App/app/build/paparazzi
            App/app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 7
