name: 🔨 CI — Android Build & Test

# WHAT THIS DOES
#   On every push (any branch) touching App/** or this file, and on every PR
#   touching App/**: compiles the Kotlin app, runs JVM unit tests, runs Android
#   lint, builds the debug APK, and uploads it plus failure diagnostics.
#
# WHAT IT NEEDS
#   Nothing secret. JDK 21 (AGP 9.1.1 requires 17+; Paparazzi alpha04+ needs
#   21), Android SDK platforms 35 + 36 + 37.0 + build-tools 35.0.0 + 36.0.0
#   (compileSdk=37 in App/app/build.gradle.kts; the baselineprofile module
#   compiles at 37 too since the BOM bump).
#
# DESIGN DECISIONS (2026)
#   * Android SDK: we install an EXPLICIT package list with
#     android-actions/setup-android@v4 AFTER setup-java, instead of relying on
#     AGP's `android.builder.sdkDownload` auto-provisioning. Reasons:
#       - sdkmanager itself needs Java 17+; running it after setup-java makes
#         any JDK problem fail in a named step, not inside Gradle.
#       - AGP auto-download happens mid-build with a generic
#         "Failed to install the following SDK components" error (often
#         license-related) that is the classic way CI dies before Gradle ever
#         touches the Kotlin. An explicit step either works fast or fails loud.
#       - GitHub-hosted ubuntu-24.04 images ship an SDK, but which
#         platforms/build-tools are preinstalled drifts with image updates;
#         pinning the packages we need (android-35, android-36, android-37.0, 35.0.0, 36.0.0) is deterministic.
#   * Gradle is invoked ONCE per job with `--continue` so the fleet sees
#     ALL of that job's task results in one log, not just the first failure.
#     Task names are the AGP-generated per-variant tasks
#     (`:app:assembleDebug`, `:app:testDebugUnitTest`, `:app:lintDebug`);
#     `:app` is the app module and `:baselineprofile` (feel-instant S7)
#     is the Baseline Profile generator module in settings.gradle.kts.
#   * Lint runs as its OWN job in parallel with the build job (2026-11-15):
#     lint is 1–2 min of a 4–7 min run, and steps inside one job run
#     sequentially while jobs run in parallel. The workflow verdict is
#     unchanged — GitHub fails the run if EITHER job fails — and the lint
#     report is uploaded from the lint job, so a lint failure is still one
#     click away in the same run. The build job keeps its single invocation
#     (assemble + tests) and the Paparazzi verify step.
#   * Cache poisoning: we cache ONLY ~/.gradle (dependency modules, wrapper
#     dists, transform + build caches — all content-addressed by Gradle).
#     We deliberately DO NOT cache the project's App/.gradle directory, which
#     holds configuration-cache/incremental state keyed to absolute paths and
#     is the one location that can silently poison a rebuild. The cache key
#     includes gradle-wrapper.properties, libs.versions.toml and all build
#     scripts, so any dependency/JDK/Gradle version change starts a fresh bucket.
#   * Action versions are pinned to full commit SHAs (no floating majors).
#
# KNOWN FAILURE MODES THIS FILE FIXES
#   1. GitHub never discovered any workflow: on `main` the files sat at
#      `radd-stream/.github/workflows/` and `App/.github/workflows/` — neither
#      is the repository root, where GitHub looks. (API confirmed: 0 workflows,
#      0 runs ever.) This file lives at <repo-root>/.github/workflows/ci.yml.
#   2. Old runs died at "Android SDK setup" — sdkmanager licensing/Java issues
#      (see DESIGN DECISIONS above; JDK now provably precedes SDK install).
#   3. gradlew may lose the +x bit through some checkout paths — chmod anyway.
#   4. If the first Kotlin errors were invisible: on failure we upload the
#      test-result and lint-report XML trees so errors survive past the log.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "App/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "App/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  # One active run per workflow+ref; newer pushes supersede older ones.
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + testDebugUnitTest
    runs-on: ubuntu-24.04   # pinned, not `ubuntu-latest`, so runner drift is visible
    timeout-minutes: 45     # the 45-min known flake: re-run, do not fix

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ☕ Set up JDK 21 (temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"   # Gradle runs on 21 (Paparazzi alpha04+ needs it); compileOptions / jvmTarget stay 17

      - name: 📦 Restore Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java21-${{ hashFiles('App/gradle/wrapper/gradle-wrapper.properties', 'App/gradle/libs.versions.toml', 'App/**/*.gradle.kts', 'App/**/*.gradle', 'App/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-java21-
            gradle-${{ runner.os }}-

      - name: ✅ Accept Android SDK licenses (incl. API 37 preview)
        # setup-android's own license step cannot accept the API 37 preview
        # license non-interactively (its sdkmanager --licenses prompts and
        # stdin is closed in CI). Pre-accept with the preinstalled
        # cmdline-tools, which writes $ANDROID_HOME/licenses/ for the
        # installer to honor. `|| true`: a hiccup here must not fail the
        # job — the install step fails loudly if a license is still missing.
        run: |
          SDKMAN="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true; fi
      - name: 📱 Install Android SDK (platform-tools, android-35, android-36, android-37.0, build-tools 35.0.0, build-tools 36.0.0)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-36 platforms;android-37.0 build-tools;35.0.0 build-tools;36.0.0"

      - name: 🔧 Make gradlew executable
        run: chmod +x App/gradlew

      - name: 🔑 Restore google-services.json (CI secret, never committed)
        # google-services.json is gitignored: GitHub secret scanning flags the
        # Firebase client key inside it. CI restores the file from the
        # GOOGLE_SERVICES_JSON Actions secret (base64) so the google-services
        # plugin can run; the file never lands in git.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON secret is empty" >&2; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > App/app/google-services.json

      - name: "🏗️🧪 Gradle: debug APK + unit tests (single invocation)"
        working-directory: App
        # --continue: report every task's failures in one run.
        # --no-daemon/--stacktrace per project standard.
        # --console=plain: unadorned file:line Kotlin errors, no ANSI noise.
        # :baselineprofile:assembleBenchmarkRelease +
        # :baselineprofile:assembleNonMinifiedRelease (feel-instant S7):
        # the Baseline Profile generator is instrumented-only — it never
        # runs in CI, so compiling + packaging its test APKs is the gate
        # that keeps a typo in the generator from landing silently. It
        # needs no device; generation itself
        # (`:app:generateBaselineProfile`) is a device run and stays out
        # of CI. Note the per-variant tasks, NOT the `assemble` lifecycle
        # task and NOT `:baselineprofile:assembleDebug`: a
        # `com.android.test` module with the producer plugin has no
        # per-build-type assemble task (Android CI 44425691304 proved it
        # — TaskSelectionException in 20 s), and the `assemble` lifecycle
        # task pulls in `:baselineprofile:connectedNonMinifiedRelease-
        # AndroidTest`, which fails on a deviceless runner with "No
        # connected devices!" (Android CI 44432484757 proved it — both
        # variant assembles had already succeeded). The two per-variant
        # tasks build both variants (benchmarkRelease = the minified
        # release-like build generation runs against, nonMinifiedRelease
        # = the unminified one) with no connected test in the graph.
        run: |
          ./gradlew :app:checkDebugOnly :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :baselineprofile:assembleBenchmarkRelease :baselineprofile:assembleNonMinifiedRelease \
            --no-daemon --stacktrace --continue --console=plain

      - name: "📸 Verify Paparazzi goldens (explicit gate)"
        working-directory: App
        # testDebugUnitTest does NOT fail on missing or stale goldens (proven
        # 2026-11-15: main-ci went green twice with uncommitted snapshots),
        # so the goldens gate on nothing unless this task runs. verify fails
        # the build when a render differs from its golden or one is missing —
        # that is the onboarding flow: record, commit the PNGs, then green.
        # --tests: Paparazzi classes ONLY, same reason as paparazzi.yml —
        # the verify task drives testDebugUnitTest, and a Robolectric test
        # loading first in a shared fork breaks Paparazzi's Bridge.init
        # (cashapp/paparazzi#1979; APP-10 verify step 06:31Z 24 Nov).
        # Keep this list in sync with paparazzi.yml's record list and
        # with the Paparazzi include list in App/app/build.gradle.kts —
        # a class missing here never verifies (DetailLargeFont, Nov 2026).
        run: |
          ./gradlew :app:verifyPaparazziDebug \
            --tests "com.raddstream.app.ui.PaparazziPreviewTest" \
            --tests "com.raddstream.app.ui.PlayerLandscapePaparazziTest" \
            --tests "com.raddstream.app.ui.screens.DetailLargeFontPaparazziTest" \
            --tests "com.raddstream.app.ui.screens.SettingsLargeFontPaparazziTest" \
            --tests "com.raddstream.app.ui.DownloadsPaparazziTest" \
            --tests "com.raddstream.app.ui.DownloadsPaparazziLargeFontTest" \
            --tests "com.raddstream.app.ui.screens.MyListLargeFontPaparazziTest" \
            --tests "com.raddstream.app.ui.SearchLargeFontPaparazziTest" \
            --no-daemon --stacktrace --console=plain

      - name: 📤 Upload debug APK
        if: always()   # assembleDebug may succeed while tests/lint fail — the APK is the most useful output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-debug-${{ github.run_number }}
          path: App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: 📤 Upload test + lint reports (diagnostics)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-reports-${{ github.run_number }}
          path: |
            App/app/build/test-results
            App/app/build/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: 📊 Build summary
        if: success()
        run: |
          APK="App/app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "## ✅ Android CI"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| APK size | $(du -h "$APK" | cut -f1) |"
            # MX idea #1: the FFmpeg size impact, measured not estimated —
            # the libffmpegJNI.so the Jellyfin decoder AAR contributes to
            # the APK per ABI (the .so files are stored uncompressed in
            # the APK, so these are the real per-ABI cost). The unzip|grep|
            # awk pipeline exits 0 even with no match (awk is last), so an
            # ABI the artifact does not ship reports an empty size instead
            # of failing the step.
            echo "| FFmpeg .so in APK (arm64-v8a) | $(unzip -l "$APK" | grep 'arm64-v8a/libffmpegJNI.so' | awk '{print $1}') bytes |"
            echo "| FFmpeg .so in APK (armeabi-v7a) | $(unzip -l "$APK" | grep 'armeabi-v7a/libffmpegJNI.so' | awk '{print $1}') bytes |"
            echo "| FFmpeg .so in APK (x86) | $(unzip -l "$APK" | grep 'x86/libffmpegJNI.so' | awk '{print $1}') bytes |"
            echo "| FFmpeg .so in APK (x86_64) | $(unzip -l "$APK" | grep 'x86_64/libffmpegJNI.so' | awk '{print $1}') bytes |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo ""
            echo "Debug APK is in the Artifacts tab of this run."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lintDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # the 45-min known flake: re-run, do not fix

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ☕ Set up JDK 21 (temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: 📦 Restore Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java21-${{ hashFiles('App/gradle/wrapper/gradle-wrapper.properties', 'App/gradle/libs.versions.toml', 'App/**/*.gradle.kts', 'App/**/*.gradle', 'App/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-java21-
            gradle-${{ runner.os }}-

      - name: ✅ Accept Android SDK licenses (incl. API 37 preview)
        # setup-android's own license step cannot accept the API 37 preview
        # license non-interactively (its sdkmanager --licenses prompts and
        # stdin is closed in CI). Pre-accept with the preinstalled
        # cmdline-tools, which writes $ANDROID_HOME/licenses/ for the
        # installer to honor. `|| true`: a hiccup here must not fail the
        # job — the install step fails loudly if a license is still missing.
        run: |
          SDKMAN="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true; fi
      - name: 📱 Install Android SDK (platform-tools, android-35, android-36, android-37.0, build-tools 35.0.0, build-tools 36.0.0)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-36 platforms;android-37.0 build-tools;35.0.0 build-tools;36.0.0"

      - name: 🔧 Make gradlew executable
        run: chmod +x App/gradlew

      - name: 🔑 Restore google-services.json (CI secret, never committed)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON secret is empty" >&2; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > App/app/google-services.json

      - name: "🔍 Gradle: lintDebug"
        working-directory: App
        run: |
          ./gradlew :app:lintDebug \
            --no-daemon --stacktrace --console=plain

      - name: 📤 Upload lint reports (diagnostics)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-lint-${{ github.run_number }}
          path: |
            App/app/build/reports
          if-no-files-found: ignore
          retention-days: 7
