# Emulator screenshots — on-demand, free (public repo)
# First dispatch (run 43999661140) FAILED at "Install Android SDK":
# android-actions/setup-android@v2 ran `sdkmanager --licenses`
# interactively ("7 of 8 SDK package licenses not accepted", y/N with no
# input) and then tried to install the obsolete `tools` package ("Failed to
# find package 'tools'", sdkmanager exit 1). The `tools` package was never
# in our list — v2's internals invoked it. Fix (2026-11-17): mirror ci.yml
# exactly — setup-android v4.0.4 pinned to the same commit SHA, runner
# pinned to ubuntu-24.04, all actions SHA-pinned, google-services.json
# restored before the Gradle build (the debug build needs it, same as CI).
# Second dispatch (run 44002960788) FAILED at the capture step, not the SDK:
# the emulator DID boot ("Emulator booted", 593 s — software mode, no KVM on
# the hosted runner) but the script died at once: `OUT="$GITHUB_WORKSPACE/emu-shots"`
# expanded to empty inside android-emulator-runner's script context, so
# `mkdir -p ""` failed ("cannot create directory ''", exit 1). Fix: fall back
# to $PWD (`${GITHUB_WORKSPACE:-$PWD}`) and raise emulator-boot-timeout
# 600 -> 900 s (boot took 593 s, 7 s inside the old limit).
# Third dispatch (run 44009742313) FAILED the SAME way at the same line:
# the $PWD fallback did not help, because the action executes the `script:`
# input LINE BY LINE, each line in a fresh `sh -c` (the log shows a separate
# `[command]/usr/bin/sh -c <line>` per line) — so shell variables and functions
# set on one line do NOT survive to the next, and `mkdir -p "$OUT"` saw ''.
# Fix (2026-11-17): the drive logic moved verbatim into
# `.github/scripts/emu-drive.sh`, run by the workflow as ONE line
# (`bash .github/scripts/emu-drive.sh <seconds>`), so the whole flow runs in
# a single shell and state persists. The $PWD fallback stays inside the file.
#
# What it does: builds the debug APK, boots a free hardware-accelerated
# emulator (KVM on the GitHub-hosted Ubuntu runner — free and unlimited for
# public repos), installs the APK, taps through Disclaimer -> Welcome,
# screenshots the Home screen (top + scrolled), records a short video, and
# uploads everything as run artifacts (7-day retention).
#
# Cost: $0. No card, no signup, no third party. Runs on workflow_dispatch only,
# so it never fires on pushes.

name: Emulator screenshots

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level for the emulator"
        required: false
        default: "34"
      screenrecord_seconds:
        description: "Video length in seconds (max ~150)"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java17-${{ hashFiles('App/gradle/wrapper/gradle-wrapper.properties', 'App/gradle/libs.versions.toml', 'App/**/*.gradle.kts', 'App/**/*.gradle', 'App/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-java17-
            gradle-${{ runner.os }}-

      - name: Install Android SDK (platform-tools, android-35, build-tools 35.0.0)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore google-services.json (CI secret, never committed)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON secret is empty" >&2; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > App/app/google-services.json

      - name: Build debug APK
        working-directory: App
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Boot emulator, drive app, capture screenshots + video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: true
          # ONE line on purpose: the action runs `script:` line by line in
          # fresh shells (see header comment) — the drive logic lives in
          # .github/scripts/emu-drive.sh so its variables/functions persist.
          script: bash .github/scripts/emu-drive.sh "${{ inputs.screenrecord_seconds }}"

      - name: Upload screenshots + video
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: emulator-shots-${{ github.run_number }}
          path: emu-shots/
          if-no-files-found: warn
          retention-days: 14
