# BOM bump (2026-11-25): AGP 9.1.1 / Gradle 9.3.1 / Kotlin 2.2.21 /
# Media3 1.11.1 / NextLib 1.11.1-0.19.0 / Hilt 2.58 / Room 2.7.2 /
# Coil 3.4.0 / Compose BOM 2026.11.01 (M3 1.5.0 stable, MotionScheme
# public) / compileSdk 37 (targetSdk stays 35). AGP 9.1.1 is the patch
# that supports API 37 (Google: API 37 needs AGP 9.1.1 minimum).
# Media3 1.11.1 raised minSdk to 23
# (since 1.9.0 — verified against the 1.11.1 AAR manifests), so the app's
# minSdk moved 21 → 23 with it: Android 5.0/5.1 are dropped, and the app
# is pre-launch so no installed base is affected. M3 1.5.0 IS in this
# bump (2026-11-25): it ships in Compose BOM 2026.11.01 and needs
# compileSdk 37 + AGP 9.1.1 — MotionScheme.expressive() is public now.

[versions]
agp                 = "9.1.1"
kotlin              = "2.2.21"
compose-bom         = "2026.11.01"
activity-compose    = "1.9.0"
navigation-compose  = "2.8.9"
media3              = "1.11.1"
# FFmpeg software audio decoder (MX idea #1): NextLib's prebuilt
# nextlib-media3ext tracks Media3 1.11.1 exactly — the version is
# "<media3>-<nextlib build>", 1.11.1-0.19.0. It replaced Jellyfin's
# media3-ffmpeg-decoder in the 2026-11-23 library bump: Jellyfin's
# decoder caps at Media3 1.9.0+1, so it could not follow the upgrade
# to 1.11.1. NextLib carries the same five audio decoders (ac3, eac3,
# dca, truehd, mlp) on FFmpeg 9.0.1 — see App/ffmpeg/NOTICE.md.
# License: the NextLib artifact is GPL-3.0 (FFmpeg itself LGPL 2.1+);
# the repo has no license file, so this is flagged for the owner in
# App/ffmpeg/NOTICE.md, not a blocker.
nextlib-media3ext = "1.11.1-0.19.0"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
hilt                = "2.58"
hilt-navigation     = "1.2.0"
hilt-work           = "1.2.0"
room                = "2.7.2"
# Paging 3 (feel-instant S6): one version for the whole paging-* group —
# runtime, compose and testing are released together, and mixing versions
# across them breaks (3.3.6 is the stable line the S6 research found in
# the wild; 3.5.x adds KMP targets this Android-only app does not need).
# RemoteMediator + room-paging come later with S3c, not this slice.
paging              = "3.3.6"
coil                = "3.4.0"
lifecycle           = "2.8.3"
coroutines          = "1.8.1"
datastore           = "1.1.1"
core-ktx            = "1.13.1"
robolectric         = "4.14.1"
androidx-test       = "1.6.1"
# Baseline Profiles (feel-instant S7): the Gradle plugin and the
# Macrobenchmark rule that generate them move together on one version —
# 1.4.1 is the stable line the AndroidX release notes list (1.5.0 exists
# but is a month old). The plugin's minimum AGP is 8.x, so 9.1.1
# satisfies it.
benchmark           = "1.4.1"
# UiAutomator drives the profile generator's Home → Search → Detail
# journey (tab taps, typing, result taps). 2.3.0 is the stable line that
# pairs with androidx-test 1.6.1; 2.4.x is newer and unproven here.
uiautomator         = "2.3.0"
workmanager         = "2.9.0"
play-app-update     = "2.1.0"
# Google Cast sender (E2 slice 3 spike, 2026-11-18): 21.4.0 is the line
# that fits this app — 22.x/23.x need minSdk 24 per Google's Cast
# integrate doc. 21.4.0 stays pinned; the app's minSdk is 23 since the
# 2026-11-23 library bump, so 21.4.0 is comfortably inside it.
cast-framework      = "21.4.0"
# MX #9 Cast: the route-picker button (MediaRouteButton) lives in the
# MediaRouter library, not in the Cast framework — 1.7.0 is the latest
# stable and needs no minSdk bump.
mediarouter           = "1.7.0"
# Core library desugaring (MX idea #1): the NextLib FFmpeg decoder AAR
# declares that it requires desugaring (its aar-metadata sets
# coreLibraryDesugaringEnabled=true, inherited from Media3's library
# config) — AGP's checkDebugAarMetadata fails the build without it
# (proven by Android CI 44393698539). 2.0.4 is the standard pairing;
# it backports java.time etc. to this app's minSdk 23.
desugar-jdk-libs    = "2.0.4"
# 19.3.0 + firebase-analytics 22.1.2 — both declare minSdk 21 in their
# manifests (verified against the published AARs), below this app's
# minSdk 23, so no manifest-merger conflict. google-services 4.6.0 and the
# Crashlytics Gradle plugin 3.0.8 are the latest of their lines and pair
# with AGP 9.1.1.
firebase-bom        = "33.7.0"
google-services     = "4.6.0"
crashlytics-plugin  = "3.0.8"
# Paparazzi 2.0.0-alpha05.1 (2026-11-25): JVM screenshot tests for Compose —
# renders real composables via Layoutlib, no emulator/device. 1.3.5 was tried
# first and FAILED structurally: its Jellyfish layoutlib cannot mirror the
# API-36 android.os.Build (Renderer.configureBuildProperties .single throws),
# and compileSdk 36 is forced by Media3 1.11.1/NextLib. alpha05.1 is the
# release that supports AGP 9 (changelog 2026-09-28; alpha04+ needs Java
# 21, so CI runs JDK 21 now). It swaps layoutlib's simplified window and
# render model for the framework's, so renders may differ from the alpha02
# goldens — re-record after this bump. Paparazzi 2.x CONFLICTS with
# Robolectric tests in the same module (cashapp/paparazzi#1979: a
# Robolectric test running first in the fork breaks Bridge.init), so the
# two Paparazzi-rule classes are excluded from testDebugUnitTest and run
# only via verifyPaparazziDebug (own JVM).
paparazzi           = "2.0.0-alpha05.1"

[libraries]
# Compose
compose-bom             = { group = "androidx.compose", name = "compose-bom",          version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-ui-preview      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended  = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose        = { group = "androidx.activity", name = "activity-compose",     version.ref = "activity-compose" }

# Navigation
navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Media3 / ExoPlayer
media3-exoplayer        = { group = "androidx.media3", name = "media3-exoplayer",      version.ref = "media3" }
media3-exoplayer-hls    = { group = "androidx.media3", name = "media3-exoplayer-hls",  version.ref = "media3" }
media3-exoplayer-dash   = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-datasource       = { group = "androidx.media3", name = "media3-datasource",     version.ref = "media3" }
media3-ui               = { group = "androidx.media3", name = "media3-ui",             version.ref = "media3" }
media3-session          = { group = "androidx.media3", name = "media3-session",         version.ref = "media3" }
# MX #9 Cast: media3-cast at the pinned 1.11.1 — the 1.9.0 rewrite is now
# in use (CastPlayer.Builder + RemoteCastPlayer.Builder, see
# CastTransferManager.kt); the pre-1.9 constructors and
# setSessionAvailabilityListener are deprecated but still present.
media3-cast             = { group = "androidx.media3", name = "media3-cast",            version.ref = "media3" }
# FFmpeg software audio decoder (MX idea #1): NextLib's prebuilt
# nextlib-media3ext — the same five audio decoders as the Jellyfin
# build it replaced, on Media3 1.11.1 + FFmpeg 9.0.1. Wired as
# NextRenderersFactory in PlaybackService.kt; FfmpegSupport checks
# io.github.anilbeesetti.nextlib.media3ext.ffdecoder.FfmpegLibrary.
nextlib-media3ext     = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlib-media3ext" }

# Networking
retrofit                = { group = "com.squareup.retrofit2", name = "retrofit",               version.ref = "retrofit" }
retrofit-gson           = { group = "com.squareup.retrofit2", name = "converter-gson",         version.ref = "retrofit" }
okhttp                  = { group = "com.squareup.okhttp3",   name = "okhttp",                 version.ref = "okhttp" }
okhttp-logging          = { group = "com.squareup.okhttp3",   name = "logging-interceptor",    version.ref = "okhttp" }

# Hilt DI
hilt-android            = { group = "com.google.dagger", name = "hilt-android",              version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-android-compiler",     version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose",   version.ref = "hilt-navigation" }

# Room
room-runtime            = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coil (image loading) — Coil 3 since the 2026-11-23 library bump:
# io.coil-kt.coil3, and network loading is a separate artifact now
# (coil-network-okhttp) — Coil 3 core no longer loads network images.
coil-compose            = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp     = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Lifecycle + Coroutines
lifecycle-viewmodel     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Paging 3 (feel-instant S6): network-only PagingSource for browse/search.
# paging-runtime is the Pager/PagingSource core; paging-compose is
# collectAsLazyPagingItems; paging-testing is TestPager for the source tests.
paging-runtime          = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
paging-compose          = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
paging-testing          = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }

# DataStore
datastore-preferences   = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager (the closed-app sweep: TTL auto-delete + low-storage eviction
# while the app is not running; the live sweep already runs in-process)
workmanager             = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
work-testing            = { group = "androidx.work", name = "work-testing",     version.ref = "workmanager" }
hilt-work               = { group = "androidx.hilt", name = "hilt-work",         version.ref = "hilt-work" }
# The annotation processor that generates the per-worker assisted factory
# (<Worker>_AssistedFactory) and the Hilt module that binds it into
# HiltWorkerFactory's map. Without it @HiltWorker is inert: the worker still
# compiles (hilt-android-compiler generates the Dagger factory) but WorkManager
# falls back to reflection at runtime and throws NoSuchMethodException — the
# S6 device crash (Session 160). The runtime (hilt-work) and the processor
# (hilt-compiler) are separate artifacts; shipping only the first is the bug.
hilt-work-compiler      = { group = "androidx.hilt", name = "hilt-compiler",   version.ref = "hilt-work" }

# Core
core-ktx                = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

# Core library desugaring (MX idea #1, 2026-11-19): required by the
# NextLib FFmpeg decoder AAR — see the version note above.
desugar-jdk-libs        = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar-jdk-libs" }

# Firebase (Crashlytics crash reporting + Analytics; versions managed by the
# BOM — no version.ref on the libraries themselves)
firebase-bom            = { group = "com.google.firebase", name = "firebase-bom",         version.ref = "firebase-bom" }
firebase-analytics      = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics    = { group = "com.google.firebase", name = "firebase-crashlytics" }

# Play Core in-app updates (force-update card: flexible for soft, immediate
# for forced; the download page is the fallback when Play has no update for
# this install — always, for a sideloaded build)
play-app-update         = { group = "com.google.android.play", name = "app-update",     version.ref = "play-app-update" }
play-app-update-ktx     = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "play-app-update" }

# Google Cast sender (E2 slice 3 spike): CastContext / Default Media Receiver
# wiring only — no cast button UI yet (see App/docs/CAST_SPIKE_20261118.md).
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "cast-framework" }
# MX #9 Cast: MediaRouteButton (the route-picker button) — explicit, so the
# import does not ride on a transitive edge of the Cast framework.
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediarouter" }

# Testing
junit                   = { group = "junit", name = "junit", version = "4.13.2" }
robolectric             = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core      = { group = "androidx.test", name = "core", version.ref = "androidx-test" }
# Baseline Profiles (feel-instant S7): the generator module's test
# dependencies. ext-junit 1.2.1 + runner 1.6.2 are the versions that pair
# with androidx-test 1.6.1 above; the macro rule is the generator itself.
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-test-runner    = { group = "androidx.test", name = "runner", version = "1.6.2" }
uiautomator             = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
benchmark-macro-junit4  = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
# Compose semantics assertions, run on the JVM under Robolectric (no emulator, no KVM).
compose-ui-test-junit4  = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application",        version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-kapt         = { id = "org.jetbrains.kotlin.kapt",      version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services", version.ref = "google-services" }
crashlytics         = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics-plugin" }
# Baseline Profiles (feel-instant S7): the Gradle plugin that generates
# them. Version tracks the benchmark library above (one release train).
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
paparazzi           = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
